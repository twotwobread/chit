name: pr-lifecycle
version: 1

policy: ".harness/policies/default.yml"
rulepack: ".harness/policies/rulepacks/pr-lifecycle.yml"

phases:
  pr.lifecycle:
    contract: ".harness/contracts/pr-lifecycle.contract.md"
    provider: "pr-lifecycle-provider"

checks:
  before_pr_create_or_update:
    - pr-readiness

  before_merge:
    - pr-merge-readiness
