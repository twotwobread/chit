name: docs-cleanup
version: 1

rulepack: ".harness/rulepacks/docs-cleanup.yml"

phases:
  docs.cleanup:
    contract: ".harness/contracts/docs-cleanup.contract.md"
    provider: "docs-cleanup-provider"

gates:
  before_complete:
    - require_stale_reference_search: true
    - require_generated_adapters_synced_when_touched: true
