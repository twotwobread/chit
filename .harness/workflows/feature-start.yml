name: feature-start
version: 1

policy: ".harness/policies/default.yml"
rulepack: ".harness/policies/rulepacks/feature-start.yml"

artifacts:
  run_dir: ".harness/runs/{run_id}"
  run_state: ".harness/runs/{run_id}/run.yaml"
  user_request: ".harness/runs/{run_id}/artifacts/user-request.md"
  classification: ".harness/runs/{run_id}/artifacts/classification.yaml"
  provider_selection: ".harness/runs/{run_id}/provider-selection.yaml"
  canonical_spec: ".harness/runs/{run_id}/artifacts/feature.spec.md"
  spec_review: ".harness/runs/{run_id}/artifacts/spec-review.md"
  implementation_plan: ".harness/runs/{run_id}/artifacts/implementation-plan.md"
  evaluation_report: ".harness/runs/{run_id}/artifacts/evaluation-report.md"
  ledger: ".harness/runs/{run_id}/artifacts/ledger.md"
  verification: ".harness/runs/{run_id}/artifacts/verification.md"

phases:
  change.classify:
    contract: ".harness/contracts/change-classify.contract.md"
    provider: "default-change-classifier"

  spec.author:
    contract: ".harness/contracts/spec-authoring.contract.md"
    provider_policy: "spec-authoring-policy"

  spec.review:
    contract: ".harness/contracts/spec-review.contract.md"
    provider: "default-spec-review"

  implementation.plan:
    contract: ".harness/contracts/implementation-plan.contract.md"
    provider: "default-implementation-planner"

  implementation.execute:
    contract: ".harness/contracts/implementation.contract.md"
    provider_policy: "implementation-policy"

  evaluation.checklist:
    contract: ".harness/contracts/evaluation.contract.md"
    provider: "checklist-evaluator"

  pr.create:
    contract: ".harness/contracts/pr.contract.md"
    provider: "github-pr"

  review.request:
    contract: ".harness/contracts/review-request.contract.md"
    provider: "default-review-request"
