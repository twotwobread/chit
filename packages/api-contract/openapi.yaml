          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    ReadinessResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
    ReadinessChecks:
      type: object
      required:
        - database
        - metadata
      properties:
        database:
          $ref: '#/components/schemas/ReadinessCheck'
        metadata:
          $ref: '#/components/schemas/MetadataReadinessCheck'
    ReadinessCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    MetadataReadinessCheck:
      type: object
      required:
        - status
        - schema
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        schema:
          type: string
          enum:
            - initialized
          example: initialized
    SupportedCurrency:
      type: string
      enum:
        - KRW
        - JPY
        - USD
        - EUR
    TripParticipantRole:
      type: string
      enum:
        - owner
        - member
    CreateTripRequest:
      type: object
      required:
        - name
        - startDate
        - endDate
        - defaultCurrency
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: 오사카 3박 4일
        startDate:
          type: string
          format: date
          description: Start date in YYYY-MM-DD format. Must be today or later.
          example: '2026-07-10'
        endDate:
          type: string
          format: date
          description: End date in YYYY-MM-DD format. Must be today or later and not before startDate.
          example: '2026-07-13'
        defaultCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
    Trip:
      type: object
      required:
        - id
        - name
        - startDate
        - endDate
        - defaultCurrency
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        defaultCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TripDay:
      type: object
      required:
        - id
        - date
        - dayOrder
        - lodgingPlace
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        dayOrder:
          type: integer
          minimum: 1
        lodgingPlace:
          allOf:
            - $ref: '#/components/schemas/TripPlaceSummary'
          nullable: true
    TripPlaceType:
      type: string
      enum:
        - sights
        - food
        - lodging
        - cafe
        - shopping
        - etc
    TripPlaceSummary:
      type: object
      required:
        - id
        - name
        - placeType
        - address
        - routablePlace
      properties:
        id:
          type: string
        name:
          type: string
        placeType:
          $ref: '#/components/schemas/TripPlaceType'
        address:
          type: string
        routablePlace:
          allOf:
            - $ref: '#/components/schemas/RoutablePlace'
          nullable: true
    RoutablePlace:
      type: object
      required:
        - provider
        - googlePlaceId
        - latitude
        - longitude
      properties:
        provider:
          type: string
          enum:
            - google
        googlePlaceId:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    GeoPoint:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    GeoBounds:
      type: object
      required:
        - northeast
        - southwest
      properties:
        northeast:
          $ref: '#/components/schemas/GeoPoint'
        southwest:
          $ref: '#/components/schemas/GeoPoint'
    CreateRoutePreviewRequest:
      type: object
      required:
        - origin
      additionalProperties: false
      properties:
        origin:
          $ref: '#/components/schemas/GeoPoint'
    RoutePreviewSummary:
      type: object
      required:
        - durationSeconds
        - distanceMeters
        - summaryText
        - transferCount
      properties:
        durationSeconds:
          type: integer
          minimum: 0
        distanceMeters:
          type: integer
          minimum: 0
        summaryText:
          type: string
        transferCount:
          type: integer
          nullable: true
          minimum: 0
    RoutePreviewMap:
      type: object
      required:
        - encodedPolyline
        - origin
        - destination
        - bounds
      properties:
        encodedPolyline:
          type: string
        origin:
          $ref: '#/components/schemas/GeoPoint'
        destination:
          $ref: '#/components/schemas/GeoPoint'
        bounds:
          $ref: '#/components/schemas/GeoBounds'
    RoutePreviewResponse:
      type: object
      required:
        - scheduleItemId
        - mode
        - summary
        - map
        - generatedAt
      properties:
        scheduleItemId:
          type: string
        mode:
          type: string
          enum:
            - transit
        summary:
          $ref: '#/components/schemas/RoutePreviewSummary'
        map:
          allOf:
            - $ref: '#/components/schemas/RoutePreviewMap'
          nullable: true
        generatedAt:
          type: string
          format: date-time
    ScheduleItem:
      type: object
      required:
        - id
        - itemOrder
        - version
        - isLodging
        - arrivedAt
        - skippedAt
        - place
      properties:
        id:
          type: string
        itemOrder:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 1
        isLodging:
          type: boolean
        arrivedAt:
          type: string
          format: date-time
          nullable: true
          description: Server-generated arrival timestamp for this schedule item instance. Null means pending when skippedAt is also null.
        skippedAt:
          type: string
          format: date-time
          nullable: true
          description: Server-generated skip timestamp for this schedule item instance. Null means the item is not currently skipped.
        place:
          $ref: '#/components/schemas/TripPlaceSummary'
    GetDayScheduleItemsResponse:
      type: object
      required:
        - day
        - scheduleItems
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        scheduleItems:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleItem'
    ListDayExpensesResponse:
      type: object
      additionalProperties: false
      required:
        - expenses
      properties:
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/DayExpenseListItem'
    DayExpenseListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - anchorType
        - tripDayId
        - scheduleItemId
        - expenseDate
        - displayTitle
        - place
        - amountMinor
        - currency
        - payer
        - splitPolicy
        - splits
        - createdAt
      properties:
        id:
          type: string
        anchorType:
          $ref: '#/components/schemas/ExpenseAnchorType'
        tripDayId:
          type: string
          nullable: true
        scheduleItemId:
          type: string
          nullable: true
        expenseDate:
          type: string
          format: date
        displayTitle:
          type: string
          minLength: 1
          description: User-facing title resolved by the server. For current schedule-item quick expenses this is the linked place/schedule display name or fallback place name.
        place:
          allOf:
            - $ref: '#/components/schemas/ExpensePlaceDisplay'
          nullable: true
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          $ref: '#/components/schemas/SupportedCurrency'
        payer:
          $ref: '#/components/schemas/ExpenseParticipantDisplay'
        splitPolicy:
          $ref: '#/components/schemas/ExpenseSplitPolicy'
        splits:
          type: array
          items:
            $ref: '#/components/schemas/DayExpenseSplitListItem'
        createdAt:
          type: string
          format: date-time
    DayExpenseSplitListItem:
      type: object
      additionalProperties: false
      required:
        - splitOrder
        - participant
        - amountMinor
      properties:
        splitOrder:
          type: integer
          minimum: 1
        participant:
          $ref: '#/components/schemas/ExpenseParticipantDisplay'
        amountMinor:
          type: integer
          format: int64
          minimum: 0
    GetExpenseResponse:
      type: object
      additionalProperties: false
      required:
        - expense
      properties:
        expense:
          $ref: '#/components/schemas/Expense'
    ManualExpenseSplitInput:
      type: object
      additionalProperties: false
      required:
        - participantId
        - amountMinor
      properties:
        participantId:
          type: string
          description: Current trip participant who has a positive manual burden.
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Positive burden amount in currency minor units.
    UpdateExpenseRequest:
      type: object
      additionalProperties: false
      required:
        - amountMinor
        - payerParticipantId
        - memo
        - scheduleItemId
        - splitPolicy
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        payerParticipantId:
          type: string
          description: Required current trip participant who paid the expense.
        splitPolicy:
          $ref: '#/components/schemas/ExpenseSplitPolicy'
        participantIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: Required only when splitPolicy is equal. Must be omitted for manual.
        splits:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ManualExpenseSplitInput'
          description: Required only when splitPolicy is manual. Must be omitted for equal.
        memo:
          type: string
          nullable: true
          maxLength: 240
          description: Optional memo. Empty strings are normalized to null by the server.
        scheduleItemId:
          type: string
          nullable: true
          description: Same-day schedule item to link, or null to clear the linked place.
    UpdateExpenseResponse:
      type: object
      additionalProperties: false
      required:
        - expense
      properties:
        expense:
          $ref: '#/components/schemas/Expense'
    CreateQuickExpenseRequest:
      type: object
      additionalProperties: false
      required:
        - scheduleItemId
        - amountMinor
        - payerParticipantId
        - splitPolicy
      properties:
        scheduleItemId:
          type: string
          description: Required schedule item for the selected Day. Must belong to tripId/tripDayId.
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Positive amount in currency minor units.
        payerParticipantId:
          type: string
          description: Active trip participant who paid the expense.
        splitPolicy:
          $ref: '#/components/schemas/ExpenseSplitPolicy'
        participantIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: Required only when splitPolicy is equal. Must be omitted for manual.
        splits:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ManualExpenseSplitInput'
          description: Required only when splitPolicy is manual. Must be omitted for equal.
    CreateQuickExpenseResponse:
      type: object
      additionalProperties: false
      required:
        - expense
      properties:
        expense:
          $ref: '#/components/schemas/Expense'
    Expense:
      type: object
      additionalProperties: false
      required:
        - id
        - tripId
        - anchorType
        - tripDayId
        - scheduleItemId
        - expenseDate
        - displayTitle
        - place
        - amountMinor
        - currency
        - payer
        - memo
        - splitPolicy
        - splits
        - createdAt
      properties:
        id:
          type: string
        tripId:
          type: string
        anchorType:
          $ref: '#/components/schemas/ExpenseAnchorType'
        tripDayId:
          type: string
          nullable: true
        scheduleItemId:
          type: string
          nullable: true
          description: Source schedule item. Present for schedule-item expenses; may become null if later detached to trip-level.
        expenseDate:
          type: string
          format: date
        displayTitle:
          type: string
          minLength: 1
          description: User-facing title resolved by the server.
        place:
          allOf:
            - $ref: '#/components/schemas/ExpensePlaceDisplay'
          nullable: true
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          $ref: '#/components/schemas/SupportedCurrency'
        payer:
          $ref: '#/components/schemas/ExpenseParticipantDisplay'
        memo:
          type: string
          nullable: true
          maxLength: 240
        splitPolicy:
          $ref: '#/components/schemas/ExpenseSplitPolicy'
        splits:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSplit'
        createdAt:
          type: string
          format: date-time
    ExpenseAnchorType:
      type: string
      enum:
        - trip
        - trip_day
        - schedule_item
    ExpenseDisplaySource:
      type: string
      enum:
        - live
        - fallback
      description: Display value source for diagnostics and tests. Do not render this as user-visible copy.
    ExpenseSplitPolicy:
      type: string
      enum:
        - equal
        - manual
      description: Persisted split policy for current quick expenses.
    ExpensePlaceDisplay:
      type: object
      additionalProperties: false
      required:
        - tripPlaceId
        - name
        - address
        - placeType
        - source
      properties:
        tripPlaceId:
          type: string
          nullable: true
        name:
          type: string
          minLength: 1
        address:
          type: string
          nullable: true
        placeType:
          allOf:
            - $ref: '#/components/schemas/TripPlaceType'
          nullable: true
        source:
          $ref: '#/components/schemas/ExpenseDisplaySource'
    ExpenseParticipantDisplay:
      type: object
      additionalProperties: false
      required:
        - participantId
        - displayName
        - source
      properties:
        participantId:
          type: string
          nullable: true
        displayName:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/ExpenseDisplaySource'
    ExpenseSplit:
      type: object
      additionalProperties: false
      required:
        - participant
        - amountMinor
      properties:
        participant:
          $ref: '#/components/schemas/ExpenseParticipantDisplay'
        amountMinor:
          type: integer
          format: int64
          minimum: 0
    SetDayLodgingPlaceRequest:
      type: object
      additionalProperties: false
      required:
        - tripPlaceId
      properties:
        tripPlaceId:
          type: string
    SetDayLodgingPlaceResponse:
      type: object
      required:
        - day
        - lodgingPlace
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        lodgingPlace:
          $ref: '#/components/schemas/TripPlaceSummary'
    MarkScheduleItemArrivedResponse:
      type: object
      required:
        - day
        - scheduleItem
        - scheduleItems
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        scheduleItem:
          $ref: '#/components/schemas/ScheduleItem'
        scheduleItems:
          type: array
          description: Latest server source-of-truth schedule items for the selected day, ordered by schedule order/rank.
          items:
            $ref: '#/components/schemas/ScheduleItem'
    MarkScheduleItemSkippedResponse:
      type: object
      required:
        - day
        - scheduleItem
        - scheduleItems
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        scheduleItem:
          $ref: '#/components/schemas/ScheduleItem'
        scheduleItems:
          type: array
          description: Latest server source-of-truth schedule items for the selected day, ordered by schedule order/rank.
          items:
            $ref: '#/components/schemas/ScheduleItem'
    RestoreScheduleItemResponse:
      type: object
      required:
        - day
        - scheduleItem
        - scheduleItems
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        scheduleItem:
          $ref: '#/components/schemas/ScheduleItem'
        scheduleItems:
          type: array
          description: Latest server source-of-truth schedule items for the selected day, ordered by schedule order/rank.
          items:
            $ref: '#/components/schemas/ScheduleItem'
    ReorderDayScheduleMove:
      type: object
      additionalProperties: false
      required:
        - scheduleItemId
        - beforeScheduleItemId
        - afterScheduleItemId
        - clientVersion
      properties:
        scheduleItemId:
          type: string
          description: The schedule item being moved.
        beforeScheduleItemId:
          type: string
          nullable: true
          description: The schedule item that must be immediately before the moved item after this move, or null when moving to the first position.
        afterScheduleItemId:
          type: string
          nullable: true
          description: The schedule item that must be immediately after the moved item after this move, or null when moving to the last position.
        clientVersion:
          type: integer
          minimum: 1
          description: The moved item's optimistic locking version observed by the client.
      description: Ordered move operation. The server applies moves sequentially inside one transaction. `beforeScheduleItemId` and `afterScheduleItemId` cannot both be null, and all present ids must be distinct.
    ReorderScheduleItemsRequest:
      type: object
      additionalProperties: false
      required:
        - moves
      properties:
        moves:
          type: array
          minItems: 1
          description: Ordered same-Day move operations. Applying them sequentially must produce the client's final local order.
          items:
            $ref: '#/components/schemas/ReorderDayScheduleMove'
    ReorderScheduleItemsResponse:
      type: object
      required:
        - day
        - scheduleItems
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        scheduleItems:
          type: array
          description: Latest server source-of-truth schedule items ordered by rank.
          items:
            $ref: '#/components/schemas/ScheduleItem'
    CreateManualScheduleItemRequest:
      type: object
