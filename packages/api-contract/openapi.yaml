openapi: 3.0.3
info:
  title: i-um API
  version: 0.1.0
  description: API contract for the i-um mobile app.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Trips
  - name: Flights
  - name: Places
  - name: Destinations
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      description: Returns the API liveness status.
      tags:
        - Health
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ready:
    get:
      operationId: getReady
      summary: Check API readiness
      description: Returns API readiness, including PostgreSQL migration/query readiness.
      tags:
        - Health
      responses:
        '200':
          description: API and database are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              examples:
                ok:
                  value:
                    status: ok
                    checks:
                      database:
                        status: ok
                      metadata:
                        status: ok
                        schema: initialized
        '503':
          description: API or database is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                databaseNotReady:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: database is not ready
                      details: []
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /destinations/search:
    get:
      operationId: searchDestinations
      summary: Search travel destination cities
      description: Returns Google-backed city/admin-level travel destination candidates for trip creation. Results are not persisted until trip creation.
      tags:
        - Destinations
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
          description: Trimmed search text. Must contain at least 2 characters.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: Destination search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDestinationsResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Destination provider rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Destination provider unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips:
    get:
      operationId: listTrips
      summary: List my trips
      description: Returns trips where the authenticated user is an Owner or Member participant.
      tags:
        - Trips
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Participated trips for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTripsResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createTrip
      summary: Create a trip
      description: Creates a Trip and the authenticated user's Owner participant.
      tags:
        - Trips
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTripResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips/{tripId}:
    get:
      operationId: getTripDetail
      summary: Get trip detail
      description: Returns basic trip detail for an authenticated trip participant.
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTripDetailResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateTrip
      summary: Update trip basic information
      description: Updates basic trip metadata for the authenticated trip owner. Only changed fields need to be sent.
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripRequest'
      responses:
        '200':
          description: Trip updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTripResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteTrip
      summary: Delete a trip
      description: Hard-deletes a trip for all participants when requested by the authenticated trip owner.
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Trip deleted.
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips/{tripId}/flights:
    get:
      operationId: listTripFlights
      summary: List trip flights
      description: Returns shared trip flight information and only the authenticated passenger's own personal flight detail summary.
      tags:
        - Flights
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip flights.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTripFlightsResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createTripFlight
      summary: Create a trip flight
      description: Creates shared flight metadata and passenger membership for a trip. Personal reservation fields are not created for other passengers.
      tags:
        - Flights
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripFlightRequest'
      responses:
        '201':
          description: Flight created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTripFlightResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip or passenger participant not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips/{tripId}/flights/{flightId}:
    get:
      operationId: getTripFlight
      summary: Get trip flight detail
      description: Returns shared flight detail and only the authenticated passenger's own personal flight detail.
      tags:
        - Flights
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
        - name: flightId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flight detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTripFlightResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip or flight not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateTripFlight
      summary: Update trip flight shared details
      description: Updates shared flight metadata for an existing trip flight. Any current trip participant can update these shared fields. Personal reservation and boarding-pass details are not changed.
      tags:
        - Flights
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
        - name: flightId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripFlightRequest'
      responses:
        '200':
          description: Flight updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTripFlightResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden; current user is not a current trip participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip or flight not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips/{tripId}/flights/{flightId}/passengers:
    post:
      operationId: addTripFlightPassengers
      summary: Add passengers to a trip flight
      description: Adds current trip participants to an existing shared flight. This changes passenger membership only and does not create personal reservation or boarding-pass details.
      tags:
        - Flights
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
        - name: flightId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTripFlightPassengersRequest'
      responses:
        '200':
          description: Passengers added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddTripFlightPassengersResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden; current user is not a current trip participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip or flight not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate passenger or stale participant state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips/{tripId}/flights/{flightId}/my-detail:
    put:
      operationId: upsertMyFlightPersonalDetail
      summary: Upsert my flight personal detail
      description: Upserts private reservation fields for the authenticated passenger only.
      tags:
        - Flights
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
        - name: flightId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMyFlightPersonalDetailRequest'
      responses:
        '200':
          description: Personal flight detail saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertMyFlightPersonalDetailResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden; current user is not a passenger for this flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip or flight not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips/{tripId}/flights/{flightId}/my-detail/boarding-pass:
    put:
      operationId: uploadMyFlightBoardingPass
      summary: Upload or replace my flight boarding-pass image
      description: Stores one private boarding-pass/check-in image for the authenticated passenger. The image is stored in private object storage; list/detail responses never return object keys or signed URLs.
      tags:
        - Flights
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
        - name: flightId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Boarding pass uploaded or replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadMyFlightBoardingPassResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden; current user is not a passenger for this flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip or flight not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Boarding-pass image exceeds 10 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported boarding-pass image media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Boarding-pass object storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteMyFlightBoardingPass
      summary: Delete my flight boarding-pass image
      description: Deletes the authenticated passenger's boarding-pass metadata and schedules private object cleanup. Deleting a missing own attachment is a no-op.
      tags:
        - Flights
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
        - name: flightId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Boarding pass deleted or already absent.
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden; current user is not a passenger for this flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip or flight not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips/{tripId}/flights/{flightId}/my-detail/boarding-pass/open-url:
    post:
      operationId: openMyFlightBoardingPass
      summary: Create a short-lived URL for my flight boarding pass
      description: Authorizes the authenticated passenger and returns a short-lived signed URL for the passenger's own boarding-pass image. The URL must not be persisted by clients.
      tags:
        - Flights
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
        - name: flightId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Short-lived boarding-pass URL.
          headers:
            Cache-Control:
              schema:
                type: string
              description: API response should be `no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenMyFlightBoardingPassResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden; current user is not a passenger for this flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip, flight, or own boarding pass not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Boarding-pass object storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips/{tripId}/invites:
    post:
      operationId: createTripInvite
      summary: Create or retrieve the current trip invite link
      description: Creates a new invite link for a trip owner, or returns the existing unexpired current invite link.
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: New invite link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTripInviteResponse'
        '200':
          description: Existing active invite link returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTripInviteResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invite token conflict after retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invites/{token}/accept:
    post:
      operationId: acceptTripInvite
      summary: Accept a trip invite link
      description: Accepts a reusable active trip invite for the authenticated user. Existing participants receive an idempotent success response.
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 128
