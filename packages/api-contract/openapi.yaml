  /me:
    get:
      operationId: getMe
      summary: Return the current user and linked providers
      description: Canonical current-profile endpoint. Returns the same AuthMeResponse shape as deprecated GET /auth/me.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateMe
      summary: Update the current user's display name
      description: Updates the authenticated user's canonical display name. Server trims leading/trailing whitespace, then validates 1-20 Unicode code points before storing the value.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Current user after display-name update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteMe
      summary: Delete the current account
      description: Immediately and permanently deletes the authenticated i-um account, invalidates all sessions, removes provider identities, anonymizes retained shared-trip participation, deletes solo trips, and deactivates active invites created by the deleted user.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deleted.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the current user and linked providers
      description: Deprecated compatibility alias for GET /me. Use GET /me for new clients.
      deprecated: true
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    ReadinessResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
    ReadinessChecks:
      type: object
      required:
        - database
        - metadata
      properties:
        database:
          $ref: '#/components/schemas/ReadinessCheck'
        metadata:
          $ref: '#/components/schemas/MetadataReadinessCheck'
    ReadinessCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    MetadataReadinessCheck:
      type: object
      required:
        - status
        - schema
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        schema:
          type: string
          enum:
            - initialized
          example: initialized
    SupportedCurrency:
      type: string
      enum:
        - KRW
        - JPY
        - USD
        - EUR
    TripParticipantRole:
      type: string
      enum:
        - owner
        - member
    CreateTripRequest:
      type: object
      required:
        - name
        - startDate
        - endDate
        - defaultCurrency
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: 오사카 3박 4일
        startDate:
          type: string
          format: date
          description: Start date in YYYY-MM-DD format. Must be today or later.
          example: '2026-07-10'
        endDate:
          type: string
          format: date
          description: End date in YYYY-MM-DD format. Must be today or later and not before startDate.
          example: '2026-07-13'
        defaultCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
    Trip:
      type: object
      required:
        - id
        - name
        - startDate
        - endDate
        - defaultCurrency
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        defaultCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TripDay:
      type: object
      required:
        - date
        - dayOrder
        - lodgingPlace
      properties:
        date:
          type: string
          format: date
        dayOrder:
          type: integer
          minimum: 1
        lodgingPlace:
          allOf:
            - $ref: '#/components/schemas/TripPlaceSummary'
          nullable: true
    TripPlaceType:
      type: string
      enum:
        - sights
        - food
        - lodging
        - cafe
        - shopping
        - etc
    TripPlaceSummary:
      type: object
      required:
        - id
        - name
        - placeType
        - address
      properties:
        id:
          type: string
        name:
          type: string
        placeType:
          $ref: '#/components/schemas/TripPlaceType'
        address:
          type: string
    DayItineraryItem:
      type: object
      required:
        - id
        - itemOrder
        - version
        - isLodging
        - arrivedAt
        - skippedAt
        - place
      properties:
        id:
          type: string
        itemOrder:
          type: integer
          minimum: 1
        version:
          type: integer
          minimum: 1
        isLodging:
          type: boolean
        arrivedAt:
          type: string
          format: date-time
          nullable: true
          description: Server-generated arrival timestamp for this itinerary item instance. Null means pending when skippedAt is also null.
        skippedAt:
          type: string
          format: date-time
          nullable: true
          description: Server-generated skip timestamp for this itinerary item instance. Null means the item is not currently skipped.
        place:
          $ref: '#/components/schemas/TripPlaceSummary'
    GetDayItineraryResponse:
      type: object
      required:
        - day
        - items
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DayItineraryItem'
    CreateQuickExpenseRequest:
      type: object
      additionalProperties: false
      required:
        - itineraryItemId
        - amountMinor
        - payerParticipantId
      properties:
        itineraryItemId:
          type: string
          description: Required itinerary item for the selected Day. Must belong to tripId/date.
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          description: Positive amount in currency minor units.
        payerParticipantId:
          type: string
          description: Active trip participant who paid the expense.
    CreateQuickExpenseResponse:
      type: object
      required:
        - expense
      properties:
        expense:
          $ref: '#/components/schemas/Expense'
    Expense:
      type: object
      required:
        - id
        - tripId
        - scheduledDate
        - itineraryItemId
        - tripPlaceId
        - place
        - amountMinor
        - currency
        - payerParticipantId
        - payerDisplayName
        - splits
        - createdAt
      properties:
        id:
          type: string
        tripId:
          type: string
        scheduledDate:
          type: string
          format: date
        itineraryItemId:
          type: string
          nullable: true
          description: Source itinerary item. Present at creation; may become null later if the source item is deleted and history is retained.
        tripPlaceId:
          type: string
          nullable: true
          description: Source trip place. Present at creation; may become null later if the source place is deleted and history is retained.
        place:
          $ref: '#/components/schemas/ExpensePlaceSnapshot'
        amountMinor:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/SupportedCurrency'
        payerParticipantId:
          type: string
          nullable: true
        payerDisplayName:
          type: string
        splits:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSplit'
        createdAt:
          type: string
          format: date-time
    ExpensePlaceSnapshot:
      type: object
      required:
        - name
        - address
        - placeType
      properties:
        name:
          type: string
        address:
          type: string
        placeType:
          $ref: '#/components/schemas/TripPlaceType'
    ExpenseSplit:
      type: object
      required:
        - participantId
        - displayName
        - amountMinor
      properties:
        participantId:
          type: string
          nullable: true
        displayName:
          type: string
        amountMinor:
          type: integer
          format: int64
          minimum: 0
    SetDayLodgingPlaceRequest:
      type: object
      additionalProperties: false
      required:
        - tripPlaceId
      properties:
        tripPlaceId:
          type: string
    SetDayLodgingPlaceResponse:
      type: object
      required:
        - day
        - lodgingPlace
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        lodgingPlace:
          $ref: '#/components/schemas/TripPlaceSummary'
    MarkDayItineraryItemArrivedResponse:
      type: object
      required:
        - day
        - item
        - items
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        item:
          $ref: '#/components/schemas/DayItineraryItem'
        items:
          type: array
          description: Latest server source-of-truth itinerary items for the selected day, ordered by itinerary order/rank.
          items:
            $ref: '#/components/schemas/DayItineraryItem'
    MarkDayItineraryItemSkippedResponse:
      type: object
      required:
        - day
        - item
        - items
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        item:
          $ref: '#/components/schemas/DayItineraryItem'
        items:
          type: array
          description: Latest server source-of-truth itinerary items for the selected day, ordered by itinerary order/rank.
          items:
            $ref: '#/components/schemas/DayItineraryItem'
    RestoreDayItineraryItemResponse:
      type: object
      required:
        - day
        - item
        - items
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        item:
          $ref: '#/components/schemas/DayItineraryItem'
        items:
          type: array
          description: Latest server source-of-truth itinerary items for the selected day, ordered by itinerary order/rank.
          items:
            $ref: '#/components/schemas/DayItineraryItem'
    ReorderDayItineraryMove:
      type: object
      additionalProperties: false
      required:
        - itemId
        - beforeItemId
        - afterItemId
        - clientVersion
      properties:
        itemId:
          type: string
          description: The itinerary item being moved.
        beforeItemId:
          type: string
          nullable: true
          description: The itinerary item that must be immediately before the moved item after this move, or null when moving to the first position.
        afterItemId:
          type: string
          nullable: true
          description: The itinerary item that must be immediately after the moved item after this move, or null when moving to the last position.
        clientVersion:
          type: integer
          minimum: 1
          description: The moved item's optimistic locking version observed by the client.
      description: Ordered move operation. The server applies moves sequentially inside one transaction. `beforeItemId` and `afterItemId` cannot both be null, and all present ids must be distinct.
    ReorderDayItineraryItemsRequest:
      type: object
      additionalProperties: false
      required:
        - moves
      properties:
        moves:
          type: array
          minItems: 1
          description: Ordered same-Day move operations. Applying them sequentially must produce the client's final local order.
          items:
            $ref: '#/components/schemas/ReorderDayItineraryMove'
    ReorderDayItineraryItemsResponse:
      type: object
      required:
        - day
        - items
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        items:
          type: array
          description: Latest server source-of-truth itinerary items ordered by rank.
          items:
            $ref: '#/components/schemas/DayItineraryItem'
    CreateManualDayItineraryItemRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - address
        - placeType
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: 우메다 공중정원
        address:
          type: string
          minLength: 1
          maxLength: 240
          example: 1 Chome-1-88 Oyodonaka, Kita Ward, Osaka
        placeType:
          $ref: '#/components/schemas/TripPlaceType'
    CreateManualDayItineraryItemResponse:
      type: object
      required:
