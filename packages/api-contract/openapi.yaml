      additionalProperties: false
      required:
        - installationId
        - expoPushToken
        - platform
      properties:
        installationId:
          type: string
          minLength: 8
          maxLength: 120
          description: Stable app-installation identifier generated by the mobile client.
        expoPushToken:
          type: string
          minLength: 20
          maxLength: 255
          description: Expo push token for the current installation.
        platform:
          $ref: '#/components/schemas/PushPlatform'
    PushTokenResponse:
      type: object
      required:
        - installationId
        - platform
        - status
        - lastRegisteredAt
      properties:
        installationId:
          type: string
        platform:
          $ref: '#/components/schemas/PushPlatform'
        status:
          $ref: '#/components/schemas/PushTokenStatus'
        lastRegisteredAt:
          type: string
          format: date-time
    NotificationEventType:
      type: string
      enum:
        - expense.created
    NotificationSnapshot:
      type: object
      additionalProperties: false
      required:
        - tripId
        - expenseId
        - actorDisplayName
        - expenseTitle
        - amountMinor
        - currency
      properties:
        tripId:
          type: string
        expenseId:
          type: string
        actorDisplayName:
          type: string
        expenseTitle:
          type: string
        amountMinor:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/SupportedCurrency'
    UserNotificationListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - eventType
        - title
        - body
        - actionPath
        - snapshot
        - createdAt
        - readAt
      properties:
        id:
          type: string
        eventType:
          $ref: '#/components/schemas/NotificationEventType'
        title:
          type: string
        body:
          type: string
        actionPath:
          type: string
        snapshot:
          $ref: '#/components/schemas/NotificationSnapshot'
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
    ListNotificationsResponse:
      type: object
      additionalProperties: false
      required:
        - notifications
        - nextCursor
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/UserNotificationListItem'
        nextCursor:
          type: string
          nullable: true
    MarkNotificationReadResponse:
      type: object
      additionalProperties: false
      required:
        - notification
      properties:
        notification:
          $ref: '#/components/schemas/UserNotificationListItem'
    AuthMeResponse:
      type: object
      required:
        - user
        - linkedProviders
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        linkedProviders:
          type: array
          items:
            $ref: '#/components/schemas/AuthProvider'
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              example: INTERNAL_ERROR
            message:
              type: string
              example: internal server error
            details:
              type: array
              items:
                type: object
                additionalProperties: true
