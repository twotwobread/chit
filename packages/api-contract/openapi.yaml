openapi: 3.0.3
info:
  title: i-um API
  version: 0.1.0
  description: API contract for the i-um mobile app.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      description: Returns the API liveness status.
      tags:
        - Health
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              example: INTERNAL_ERROR
            message:
              type: string
              example: internal server error
            details:
              type: array
              items:
                type: object
                additionalProperties: true
