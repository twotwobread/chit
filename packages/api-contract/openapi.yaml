openapi: 3.0.3
info:
  title: i-um API
  version: 0.1.0
  description: API contract for the i-um mobile app.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      description: Returns the API liveness status.
      tags:
        - Health
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ready:
    get:
      operationId: getReady
      summary: Check API readiness
      description: Returns API readiness, including PostgreSQL migration/query readiness.
      tags:
        - Health
      responses:
        '200':
          description: API and database are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              examples:
                ok:
                  value:
                    status: ok
                    checks:
                      database:
                        status: ok
                      metadata:
                        status: ok
                        schema: initialized
        '503':
          description: API or database is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                databaseNotReady:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: database is not ready
                      details: []
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    ReadinessResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
    ReadinessChecks:
      type: object
      required:
        - database
        - metadata
      properties:
        database:
          $ref: '#/components/schemas/ReadinessCheck'
        metadata:
          $ref: '#/components/schemas/MetadataReadinessCheck'
    ReadinessCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    MetadataReadinessCheck:
      type: object
      required:
        - status
        - schema
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        schema:
          type: string
          enum:
            - initialized
          example: initialized
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              example: INTERNAL_ERROR
            message:
              type: string
              example: internal server error
            details:
              type: array
              items:
                type: object
                additionalProperties: true
