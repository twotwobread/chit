          $ref: '#/components/schemas/TripDay'
        scheduleItem:
          $ref: '#/components/schemas/ScheduleItem'
        scheduleItems:
          type: array
          description: Latest server source-of-truth schedule items for the selected day, ordered by schedule order/rank.
          items:
            $ref: '#/components/schemas/ScheduleItem'
    ReorderDayScheduleMove:
      type: object
      additionalProperties: false
      required:
        - scheduleItemId
        - beforeScheduleItemId
        - afterScheduleItemId
        - clientVersion
      properties:
        scheduleItemId:
          type: string
          description: The schedule item being moved.
        beforeScheduleItemId:
          type: string
          nullable: true
          description: The schedule item that must be immediately before the moved item after this move, or null when moving to the first position.
        afterScheduleItemId:
          type: string
          nullable: true
          description: The schedule item that must be immediately after the moved item after this move, or null when moving to the last position.
        clientVersion:
          type: integer
          minimum: 1
          description: The moved item's optimistic locking version observed by the client.
      description: Ordered move operation. The server applies moves sequentially inside one transaction. `beforeScheduleItemId` and `afterScheduleItemId` cannot both be null, and all present ids must be distinct.
    ReorderScheduleItemTimeUpdate:
      type: object
      additionalProperties: false
      required:
        - scheduleItemId
        - expectedStartTime
        - expectedEndTime
        - startTime
        - endTime
      properties:
        scheduleItemId:
          type: string
          description: Schedule item whose time range should be updated in the same reorder transaction.
        expectedStartTime:
          type: string
          nullable: true
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          description: Client-observed current local start time in HH:mm. Null means the item was untimed when observed.
        expectedEndTime:
          type: string
          nullable: true
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          description: Client-observed current local end time in HH:mm. Null means the item had no end time when observed.
        startTime:
          type: string
          nullable: true
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          description: Target local start time in HH:mm. Null clears both start and end time.
        endTime:
          type: string
          nullable: true
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          description: Target local end time in HH:mm. Must be later than startTime when present.
      description: Optional schedule time update applied atomically with a Day reorder. Expected times must still match the current row before the update is applied.
    ReorderScheduleItemsRequest:
      type: object
      additionalProperties: false
      required:
        - moves
      properties:
        moves:
          type: array
          minItems: 1
          description: Ordered same-Day move operations. Applying them sequentially must produce the client's final local order.
          items:
            $ref: '#/components/schemas/ReorderDayScheduleMove'
        timeUpdates:
          type: array
          description: Optional time updates to apply atomically after the reorder moves. Used by timed-range drag reorder to preserve item durations and existing gaps.
          items:
            $ref: '#/components/schemas/ReorderScheduleItemTimeUpdate'
    ReorderScheduleItemsResponse:
      type: object
      required:
        - day
        - scheduleItems
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        scheduleItems:
          type: array
          description: Latest server source-of-truth schedule items ordered by rank.
          items:
            $ref: '#/components/schemas/ScheduleItem'
    MoveScheduleItemToDayRequest:
      type: object
      additionalProperties: false
      required:
        - targetTripDayId
        - clientVersion
      properties:
        targetTripDayId:
          type: string
          description: Target active trip Day id. Must belong to the same trip and differ from the source Day.
        clientVersion:
          type: integer
          minimum: 1
          description: The schedule item's optimistic locking version observed by the client.
    MoveScheduleItemToDayResponse:
      type: object
      additionalProperties: false
      required:
        - sourceDay
        - sourceScheduleItems
        - targetDay
        - targetScheduleItems
        - movedScheduleItem
      properties:
