        - displayName
        - joinedAt
      properties:
        id:
          type: string
        tripId:
          type: string
        userId:
          type: string
        role:
          $ref: '#/components/schemas/TripParticipantRole'
        displayName:
          type: string
        joinedAt:
          type: string
          format: date-time
    CreateTripResponse:
      type: object
      required:
        - trip
