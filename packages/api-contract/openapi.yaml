        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token is invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRefreshToken:
                  value:
                    error:
                      code: INVALID_REFRESH_TOKEN
                      message: refresh token is invalid
                      details:
                        - result: invalid_refresh_token
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLogoutResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/settlement-summary:
    get:
      operationId: getMySettlementSummary
      summary: Return current user's settlement summary
      description: Returns trips where the authenticated current user has a non-zero per-currency settlement balance.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user's non-zero settlement summaries by trip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMySettlementSummaryResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Settlement summary cannot be calculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/push-tokens:
    post:
      operationId: registerPushToken
      summary: Register the current app installation push token
      description: Registers or refreshes the authenticated user's Expo push token for the current app installation. Registering the same active token for the current user supersedes stale ownership from other users/installations.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushTokenRequest'
      responses:
        '200':
          description: Push token registered or refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushTokenResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/push-tokens/{installationId}:
    delete:
      operationId: revokePushToken
      summary: Revoke the current installation push token
      description: Idempotently revokes the authenticated user's push token for the given app installation.
      tags:
        - Auth
      security:
        - bearerAuth: []
      parameters:
        - name: installationId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 120
      responses:
        '204':
          description: Push token revoked or already inactive.
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/notifications:
    get:
      operationId: listNotifications
      summary: List current user's notifications
      description: Returns current user's in-app notification history, newest first.
      tags:
        - Auth
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: Current user's notification history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNotificationsResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      summary: Mark a notification as read
      description: Marks one notification belonging to the authenticated user as read.
      tags:
        - Auth
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification after read marking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkNotificationReadResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notification not found for the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me:
    get:
      operationId: getMe
      summary: Return the current user and linked providers
      description: Canonical current-profile endpoint. Returns the same AuthMeResponse shape as deprecated GET /auth/me.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateMe
      summary: Update the current user's display name
      description: Updates the authenticated user's canonical display name. Server trims leading/trailing whitespace, then validates 1-20 Unicode code points before storing the value.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Current user after display-name update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteMe
      summary: Delete the current account
      description: Immediately and permanently deletes the authenticated i-um account, invalidates all sessions, removes provider identities, anonymizes retained shared-trip participation, deletes solo trips, and deactivates active invites created by the deleted user.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deleted.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the current user and linked providers
      description: Deprecated compatibility alias for GET /me. Use GET /me for new clients.
      deprecated: true
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    ReadinessResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
    ReadinessChecks:
      type: object
      required:
        - database
        - metadata
      properties:
        database:
          $ref: '#/components/schemas/ReadinessCheck'
        metadata:
          $ref: '#/components/schemas/MetadataReadinessCheck'
    ReadinessCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    MetadataReadinessCheck:
      type: object
      required:
        - status
        - schema
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        schema:
          type: string
          enum:
            - initialized
          example: initialized
    ExpenseCategory:
      type: string
      enum:
        - cafe
        - etc
        - food
        - lodging
        - shopping
        - sights
        - transport
    SupportedCurrency:
      type: string
      enum:
        - KRW
        - JPY
        - USD
        - EUR
    TripDefaultTravelMode:
      type: string
      enum:
        - transit
        - driving
    TripParticipantRole:
      type: string
      enum:
        - owner
        - member
    FlightImageContentType:
      type: string
      enum:
        - image/jpeg
        - image/png
        - image/webp
    ReceiptImageContentType:
      type: string
      enum:
        - image/jpeg
        - image/png
        - image/webp
    ReceiptCaptureMode:
      type: string
      enum:
        - single
        - split
    ReceiptImageRole:
      type: string
      enum:
        - single
        - header
        - total
    ReceiptOCRLanguage:
      type: string
      enum:
        - ko
    ReceiptOCRTextPart:
      type: object
      additionalProperties: false
      required:
        - role
        - text
      properties:
        role:
          $ref: '#/components/schemas/ReceiptImageRole'
        text:
          type: string
          minLength: 1
          maxLength: 12000
    ExpenseReceiptConfidence:
      type: string
      enum:
        - high
        - medium
        - low
    FlightEndpointInput:
      type: object
      required:
        - airportText
        - localDate
        - localTime
        - timeZone
      additionalProperties: false
      properties:
        airportText:
          type: string
          minLength: 1
          maxLength: 120
          description: Server trims leading/trailing whitespace.
        airportCode:
          type: string
          nullable: true
          minLength: 1
          maxLength: 8
          description: Optional manually entered airport code. Server trims and uppercases when present.
        localDate:
          type: string
          format: date
          description: Airport-local date in YYYY-MM-DD format.
        localTime:
          type: string
          pattern: '^([01]\\d|2[0-3]):[0-5]\\d$'
          description: Airport-local time in HH:mm 24-hour format.
        timeZone:
          type: string
          minLength: 1
          maxLength: 80
          description: IANA time zone identifier. Abbreviations such as KST or PST are invalid.
    FlightEndpoint:
      allOf:
        - $ref: '#/components/schemas/FlightEndpointInput'
        - type: object
          required:
            - at
          properties:
            at:
              type: string
              format: date-time
              description: Server-derived UTC instant for ordering and Today windows.
    FlightPassenger:
      type: object
      required:
        - participantId
        - displayName
      additionalProperties: false
      properties:
        participantId:
          type: string
        displayName:
          type: string
    FlightBoardingPassSummary:
      type: object
      required:
        - exists
        - contentType
        - byteSize
        - uploadedAt
      additionalProperties: false
      properties:
        exists:
          type: boolean
        contentType:
          allOf:
            - $ref: '#/components/schemas/FlightImageContentType'
          nullable: true
        byteSize:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10485760
        uploadedAt:
          type: string
          format: date-time
          nullable: true
    MyFlightPersonalDetail:
      type: object
      required:
        - reservationNumber
        - seat
        - checkInUrl
        - boardingPass
      additionalProperties: false
      properties:
        reservationNumber:
          type: string
          nullable: true
          maxLength: 80
        seat:
          type: string
          nullable: true
          maxLength: 20
        checkInUrl:
          type: string
          nullable: true
          maxLength: 500
          description: Optional http/https check-in or reservation URL.
        boardingPass:
          $ref: '#/components/schemas/FlightBoardingPassSummary'
    FlightSummary:
      type: object
      required:
        - id
        - displayTitle
        - flightNumber
        - departure
        - arrival
        - passengers
        - myPersonalDetail
        - createdByUserId
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
        displayTitle:
          type: string
          minLength: 1
          maxLength: 80
        flightNumber:
          type: string
          nullable: true
          maxLength: 20
        departure:
          $ref: '#/components/schemas/FlightEndpoint'
        arrival:
          $ref: '#/components/schemas/FlightEndpoint'
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/FlightPassenger'
        myPersonalDetail:
          allOf:
            - $ref: '#/components/schemas/MyFlightPersonalDetail'
          nullable: true
          description: Current passenger's private detail only. Other passengers' private details are never returned.
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FlightDetail:
      allOf:
        - $ref: '#/components/schemas/FlightSummary'
    ListTripFlightsResponse:
      type: object
      required:
        - flights
      additionalProperties: false
      properties:
        flights:
          type: array
          items:
            $ref: '#/components/schemas/FlightSummary'
    CreateTripFlightRequest:
      type: object
      required:
        - displayTitle
        - flightNumber
        - departure
        - arrival
        - passengerParticipantIds
      additionalProperties: false
      properties:
        displayTitle:
          type: string
          minLength: 1
          maxLength: 80
          description: Server trims leading/trailing whitespace.
        flightNumber:
          type: string
          nullable: true
          maxLength: 20
          description: Optional flight number. Blank strings are stored as null.
        departure:
          $ref: '#/components/schemas/FlightEndpointInput'
        arrival:
          $ref: '#/components/schemas/FlightEndpointInput'
        passengerParticipantIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
    CreateTripFlightResponse:
      type: object
      required:
        - flight
      additionalProperties: false
      properties:
        flight:
          $ref: '#/components/schemas/FlightDetail'
    UpdateTripFlightRequest:
      type: object
      required:
        - displayTitle
        - flightNumber
        - departure
        - arrival
      additionalProperties: false
      properties:
        displayTitle:
          type: string
          minLength: 1
          maxLength: 80
          description: Server trims leading/trailing whitespace.
        flightNumber:
          type: string
          nullable: true
          maxLength: 20
          description: Optional flight number. Blank strings are stored as null.
        departure:
          $ref: '#/components/schemas/FlightEndpointInput'
        arrival:
          $ref: '#/components/schemas/FlightEndpointInput'
    UpdateTripFlightResponse:
      type: object
      required:
        - flight
      additionalProperties: false
      properties:
        flight:
          $ref: '#/components/schemas/FlightDetail'
    AddTripFlightPassengersRequest:
      type: object
      required:
        - passengerParticipantIds
      additionalProperties: false
      properties:
        passengerParticipantIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
    AddTripFlightPassengersResponse:
      type: object
      required:
        - flight
      additionalProperties: false
      properties:
        flight:
          $ref: '#/components/schemas/FlightDetail'
    GetTripFlightResponse:
      type: object
      required:
        - flight
      additionalProperties: false
      properties:
        flight:
          $ref: '#/components/schemas/FlightDetail'
    UpsertMyFlightPersonalDetailRequest:
      type: object
      required:
        - reservationNumber
        - seat
        - checkInUrl
      additionalProperties: false
      properties:
        reservationNumber:
          type: string
          nullable: true
          maxLength: 80
          description: Server trims; blank strings clear to null.
        seat:
          type: string
          nullable: true
          maxLength: 20
          description: Server trims; blank strings clear to null.
        checkInUrl:
          type: string
          nullable: true
          maxLength: 500
          description: Server trims; blank strings clear to null; non-null values must be http or https URLs.
    UpsertMyFlightPersonalDetailResponse:
      type: object
      required:
        - personalDetail
      additionalProperties: false
      properties:
        personalDetail:
          $ref: '#/components/schemas/MyFlightPersonalDetail'
    UploadMyFlightBoardingPassResponse:
      type: object
      required:
        - personalDetail
      additionalProperties: false
      properties:
        personalDetail:
          $ref: '#/components/schemas/MyFlightPersonalDetail'
    OpenMyFlightBoardingPassResponse:
      type: object
      required:
        - url
        - expiresAt
        - contentType
        - byteSize
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Short-lived signed URL. Clients must not persist it.
        expiresAt:
          type: string
          format: date-time
        contentType:
          $ref: '#/components/schemas/FlightImageContentType'
        byteSize:
          type: integer
          minimum: 1
          maximum: 10485760
    CreateTripRequest:
      type: object
      required:
        - name
        - startDate
        - endDate
        - defaultCurrency
        - destinations
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: 오사카 3박 4일
        startDate:
          type: string
          format: date
          description: Start date in YYYY-MM-DD format. Must be today or later.
          example: '2026-07-10'
        endDate:
          type: string
          format: date
          description: End date in YYYY-MM-DD format. Must be today or later and not before startDate.
          example: '2026-07-13'
        defaultCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
        defaultTravelMode:
          allOf:
            - $ref: '#/components/schemas/TripDefaultTravelMode'
          default: transit
        destinations:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/TripDestinationInput'
    DestinationProvider:
      type: string
      enum:
        - google
    TripDestinationInput:
      type: object
      required:
        - cityName
        - countryName
        - countryCode
        - displayName
        - latitude
        - longitude
        - radiusMeters
        - provider
        - providerPlaceId
      additionalProperties: false
      properties:
        cityName:
          type: string
          minLength: 1
          maxLength: 120
        countryName:
          type: string
          minLength: 1
          maxLength: 120
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Z]{2}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        radiusMeters:
          type: integer
          minimum: 1
          maximum: 500000
        provider:
          $ref: '#/components/schemas/DestinationProvider'
        providerPlaceId:
          type: string
          minLength: 1
          maxLength: 255
    DestinationSearchResult:
      allOf:
        - $ref: '#/components/schemas/TripDestinationInput'
    SearchDestinationsResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/DestinationSearchResult'
    TripDestination:
      allOf:
        - $ref: '#/components/schemas/TripDestinationInput'
        - type: object
          required:
            - id
            - tripId
            - sortOrder
          properties:
            id:
              type: string
            tripId:
              type: string
            sortOrder:
              type: integer
              minimum: 0
    Trip:
      type: object
      required:
        - id
        - name
        - startDate
        - endDate
        - defaultCurrency
        - defaultTravelMode
        - createdBy
        - createdAt
        - updatedAt
        - destinations
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        defaultCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
        defaultTravelMode:
          $ref: '#/components/schemas/TripDefaultTravelMode'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/TripDestination'
    TripDay:
      type: object
      required:
        - id
        - date
        - dayOrder
        - lodgingPlace
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        dayOrder:
          type: integer
          minimum: 1
        lodgingPlace:
          allOf:
            - $ref: '#/components/schemas/TripPlaceSummary'
          nullable: true
    TripPlaceType:
      type: string
      enum:
        - sights
        - food
        - lodging
        - cafe
        - shopping
        - transport
        - etc
    TripPlaceSummary:
      type: object
      required:
        - id
        - name
        - placeType
        - address
        - routablePlace
      properties:
        id:
          type: string
        name:
          type: string
        placeType:
          $ref: '#/components/schemas/TripPlaceType'
        address:
          type: string
        routablePlace:
          allOf:
            - $ref: '#/components/schemas/RoutablePlace'
          nullable: true
    RoutablePlace:
      type: object
      required:
        - provider
        - googlePlaceId
        - latitude
        - longitude
      properties:
        provider:
          type: string
          enum:
            - google
        googlePlaceId:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    TripPlaceBookmark:
      type: object
      additionalProperties: false
      required:
        - id
        - tripId
        - category
        - place
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        tripId:
          type: string
        category:
          $ref: '#/components/schemas/TripPlaceType'
