  /trips/{tripId}/expense-receipt-drafts:
    post:
      operationId: createExpenseReceiptDraft
      summary: Create an expense draft from Korean receipt OCR text and image capture
      description: Stores one private receipt image, or header/total images for long receipts, validates client-provided Korean OCR text, asks the model for strict JSON normalization, and returns a draft that must be reviewed before saving an expense. This endpoint never creates an expense and never returns object keys or signed URLs.
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - captureMode
                - ocrLanguage
                - ocrTextParts
              properties:
                captureMode:
                  $ref: '#/components/schemas/ReceiptCaptureMode'
                ocrLanguage:
                  $ref: '#/components/schemas/ReceiptOCRLanguage'
                ocrTextParts:
                  type: string
                  description: JSON array of ReceiptOCRTextPart. Single capture requires role `single`; split capture requires roles `header` and `total`.
                image:
                  type: string
                  format: binary
                  description: Required when captureMode is `single`.
                headerImage:
                  type: string
                  format: binary
                  description: Required when captureMode is `split`.
                totalImage:
                  type: string
                  format: binary
                  description: Required when captureMode is `split`.
      responses:
        '201':
          description: Receipt draft created.
          headers:
            Cache-Control:
              schema:
                type: string
              description: API response should be `no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExpenseReceiptDraftResponse'
        '400':
          description: Validation error or invalid extraction JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Receipt image exceeds 10 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported receipt image media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Korean receipt text could not be validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Receipt draft provider or cost rate limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: OCR or model provider unavailable, timed out, or returned invalid output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Receipt object storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
