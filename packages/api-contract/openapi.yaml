          $ref: '#/components/schemas/DayItineraryItem'
    GooglePlaceSearchResult:
      type: object
      required:
        - googlePlaceId
        - displayName
        - formattedAddress
        - primaryType
      properties:
        googlePlaceId:
          type: string
          example: ChIJ...
        displayName:
