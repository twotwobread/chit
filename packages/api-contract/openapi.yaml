        formattedAddress:
          type: string
          example: 1 Chome Dotonbori, Chuo Ward, Osaka, Japan
        primaryType:
          type: string
          example: tourist_attraction
    SearchGooglePlacesResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/GooglePlaceSearchResult'
    UpdateTripRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: 오사카 4박 5일
        startDate:
          type: string
          format: date
          description: Start date in YYYY-MM-DD format. May be past, current, or future.
          example: '2026-07-10'
        endDate:
          type: string
          format: date
          description: End date in YYYY-MM-DD format. Must not be before the merged startDate.
          example: '2026-07-14'
        defaultCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
    UpdateTripResponse:
      type: object
      required:
        - trip
      properties:
        trip:
          $ref: '#/components/schemas/Trip'
    TripListItem:
      type: object
      required:
        - id
        - name
        - startDate
        - endDate
        - defaultCurrency
        - joinedAt
        - createdAt
        - myRole
        - participantCount
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        defaultCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
        joinedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        myRole:
          $ref: '#/components/schemas/TripParticipantRole'
        participantCount:
          type: integer
          minimum: 1
    ListTripsResponse:
      type: object
      required:
        - trips
      properties:
        trips:
          type: array
          items:
            $ref: '#/components/schemas/TripListItem'
    TripParticipantListItem:
      type: object
      required:
        - participantId
        - displayName
        - role
        - joinedAt
      properties:
        participantId:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/TripParticipantRole'
        joinedAt:
          type: string
          format: date-time
    ListTripParticipantsResponse:
      type: object
      required:
        - participants
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/TripParticipantListItem'
    TripParticipant:
      type: object
      required:
        - id
        - tripId
        - userId
        - role
        - displayName
        - joinedAt
      properties:
        id:
          type: string
        tripId:
          type: string
        userId:
          type: string
        role:
          $ref: '#/components/schemas/TripParticipantRole'
        displayName:
          type: string
        joinedAt:
          type: string
          format: date-time
    CreateTripResponse:
      type: object
      required:
        - trip
        - ownerParticipant
      properties:
        trip:
          $ref: '#/components/schemas/Trip'
        ownerParticipant:
          $ref: '#/components/schemas/TripParticipant'
    TripInvite:
      type: object
      required:
        - id
        - tripId
        - token
        - inviteUrl
        - expiresAt
        - createdAt
        - createdBy
      properties:
        id:
          type: string
        tripId:
          type: string
        token:
          type: string
          minLength: 32
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: Opaque base64url token. UI copies or shares inviteUrl instead of raw token.
        inviteUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp.
        createdAt:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp.
        createdBy:
          type: string
    CreateTripInviteResponse:
      type: object
      required:
        - invite
        - created
      properties:
        invite:
          $ref: '#/components/schemas/TripInvite'
        created:
          type: boolean
          description: true when this request created a new invite, false when an existing unexpired current invite was reused.
    AcceptTripInviteResponse:
      type: object
      required:
        - tripId
        - tripName
        - role
        - alreadyAccepted
      properties:
        tripId:
          type: string
        tripName:
          type: string
        role:
          $ref: '#/components/schemas/TripParticipantRole'
        alreadyAccepted:
          type: boolean
          description: false when this request created a new member participant; true when the user was already a participant.
    TripParticipantSummary:
      type: object
      required:
        - totalCount
        - previewNames
        - overflowCount
      properties:
        totalCount:
          type: integer
          minimum: 0
          example: 4
        previewNames:
          type: array
          maxItems: 3
          items:
            type: string
          example:
            - 민수
            - 지영
            - 현우
        overflowCount:
          type: integer
          minimum: 0
          example: 1
    GetTripDetailResponse:
      type: object
      required:
        - trip
        - participantSummary
        - days
      properties:
        trip:
          $ref: '#/components/schemas/Trip'
        participantSummary:
          $ref: '#/components/schemas/TripParticipantSummary'
        days:
          type: array
          items:
            $ref: '#/components/schemas/TripDay'
    AuthProvider:
      type: string
      enum:
        - apple
        - kakao
    AuthResult:
      type: string
      enum:
        - login_success
        - refresh_success
        - logout_success
        - provider_link_success
    OAuthCredential:
      type: object
      description: Provider credential. Apple uses identityToken/authorizationCode/nonce. Kakao uses accessToken. dev* fields are accepted only when server dev OAuth is enabled.
      additionalProperties: false
      properties:
        identityToken:
          type: string
        authorizationCode:
          type: string
        nonce:
          type: string
        accessToken:
          type: string
        devSubject:
          type: string
        email:
          type: string
          nullable: true
        emailVerified:
          type: boolean
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    DeviceInfo:
      type: object
      additionalProperties: false
      properties:
        deviceName:
          type: string
          nullable: true
        platform:
          type: string
          nullable: true
    OAuthLoginRequest:
      type: object
      required:
        - provider
        - credential
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/AuthProvider'
        credential:
          $ref: '#/components/schemas/OAuthCredential'
        device:
          $ref: '#/components/schemas/DeviceInfo'
    OAuthLinkRequest:
      type: object
      required:
        - provider
        - credential
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/AuthProvider'
        credential:
          $ref: '#/components/schemas/OAuthCredential'
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      additionalProperties: false
      properties:
        refreshToken:
          type: string
    AuthUser:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    AuthTokens:
      type: object
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
    AuthLoginResponse:
      type: object
      required:
        - result
        - user
        - tokens
      properties:
        result:
          type: string
          enum:
            - login_success
        user:
          $ref: '#/components/schemas/AuthUser'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
    AuthRefreshResponse:
      type: object
      required:
        - result
        - tokens
      properties:
        result:
          type: string
          enum:
            - refresh_success
        tokens:
          $ref: '#/components/schemas/AuthTokens'
    AuthLogoutResponse:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - logout_success
    LinkedIdentity:
      type: object
      required:
        - provider
        - emailVerified
      properties:
        provider:
          $ref: '#/components/schemas/AuthProvider'
        email:
          type: string
          nullable: true
        emailVerified:
          type: boolean
    AuthLinkResponse:
      type: object
      required:
        - result
        - linkedIdentity
      properties:
        result:
          type: string
          enum:
            - provider_link_success
        linkedIdentity:
          $ref: '#/components/schemas/LinkedIdentity'
    UpdateMeRequest:
      type: object
      required:
        - displayName
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 20
          description: Server trims leading/trailing whitespace, counts Unicode code points after trim, then validates and persists the value.
    AuthMeResponse:
      type: object
      required:
        - user
        - linkedProviders
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        linkedProviders:
          type: array
          items:
            $ref: '#/components/schemas/AuthProvider'
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              example: INTERNAL_ERROR
            message:
              type: string
              example: internal server error
            details:
              type: array
              items:
                type: object
                additionalProperties: true
