        - duplicateConfirmed
      properties:
        googlePlaceId:
          type: string
          minLength: 1
          maxLength: 255
          example: ChIJ...
        duplicateConfirmed:
          type: boolean
          description: Set true only after the user confirms adding the same Google place to the same Day again.
          example: false
    CreateGooglePlaceDayItineraryItemResponse:
      type: object
      required:
        - day
        - item
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
        item:
          $ref: '#/components/schemas/DayItineraryItem'
    UpdateDayItineraryItemRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
