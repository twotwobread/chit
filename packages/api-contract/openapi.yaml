          $ref: '#/components/schemas/TripDay'
        scheduleItem:
          $ref: '#/components/schemas/ScheduleItem'
    CreateGooglePlaceScheduleItemRequest:
      type: object
      additionalProperties: false
      required:
        - googlePlaceId
