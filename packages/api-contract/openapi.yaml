openapi: 3.0.3
info:
  title: i-um API
  version: 0.1.0
  description: API contract for the i-um mobile app.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Trips
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      description: Returns the API liveness status.
      tags:
        - Health
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ready:
    get:
      operationId: getReady
      summary: Check API readiness
      description: Returns API readiness, including PostgreSQL migration/query readiness.
      tags:
        - Health
      responses:
        '200':
          description: API and database are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              examples:
                ok:
                  value:
                    status: ok
                    checks:
                      database:
                        status: ok
                      metadata:
                        status: ok
                        schema: initialized
        '503':
          description: API or database is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                databaseNotReady:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: database is not ready
                      details: []
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips:
    get:
      operationId: listTrips
      summary: List my trips
      description: Returns trips where the authenticated user is an Owner or Member participant.
      tags:
        - Trips
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Participated trips for the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTripsResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createTrip
      summary: Create a trip
      description: Creates a Trip and the authenticated user's Owner participant.
      tags:
        - Trips
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
      responses:
        '201':
          description: Trip created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTripResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /trips/{tripId}:
    get:
      operationId: getTripDetail
      summary: Get trip detail
      description: Returns basic trip detail for an authenticated trip participant.
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTripDetailResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateTrip
      summary: Update trip basic information
      description: Updates basic trip metadata for the authenticated trip owner. Only changed fields need to be sent.
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripRequest'
      responses:
        '200':
          description: Trip updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTripResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteTrip
      summary: Delete a trip
      description: Hard-deletes a trip for all participants when requested by the authenticated trip owner.
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Trip deleted.
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Trip not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/oauth/login:
    post:
      operationId: loginWithOAuth
      summary: Login or sign up with Apple or Kakao OAuth
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Provider token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidProviderToken:
                  value:
                    error:
                      code: INVALID_PROVIDER_TOKEN
                      message: provider token is invalid
                      details: []
        '409':
          description: Existing verified email requires explicit account linking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountLinkRequired:
                  value:
                    error:
                      code: ACCOUNT_LINK_REQUIRED
                      message: account link required
                      details:
                        - result: link_required_conflict
                          provider: apple
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/oauth/link:
    post:
      operationId: linkOAuthProvider
      summary: Link an Apple or Kakao OAuth identity to the current user
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLinkRequest'
      responses:
        '200':
          description: Provider linked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLinkResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized or invalid provider token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Provider identity already linked to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                providerAlreadyLinked:
                  value:
                    error:
                      code: PROVIDER_ALREADY_LINKED
                      message: provider identity is already linked
                      details:
                        - result: provider_already_linked
                          provider: kakao
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/token/refresh:
    post:
      operationId: refreshToken
      summary: Rotate a refresh token and issue a new token pair
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refresh succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthRefreshResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token is invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRefreshToken:
                  value:
                    error:
                      code: INVALID_REFRESH_TOKEN
                      message: refresh token is invalid
                      details:
                        - result: invalid_refresh_token
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLogoutResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the current user and linked providers
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    ReadinessResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        checks:
          $ref: '#/components/schemas/ReadinessChecks'
    ReadinessChecks:
      type: object
      required:
        - database
        - metadata
      properties:
        database:
          $ref: '#/components/schemas/ReadinessCheck'
        metadata:
          $ref: '#/components/schemas/MetadataReadinessCheck'
    ReadinessCheck:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
    MetadataReadinessCheck:
      type: object
      required:
        - status
        - schema
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
        schema:
          type: string
          enum:
            - initialized
          example: initialized
    SupportedCurrency:
      type: string
      enum:
        - KRW
        - JPY
        - USD
        - EUR
    TripParticipantRole:
      type: string
      enum:
        - owner
        - member
    CreateTripRequest:
      type: object
      required:
        - name
        - startDate
        - endDate
        - defaultCurrency
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: 오사카 3박 4일
        startDate:
          type: string
          format: date
          description: Start date in YYYY-MM-DD format. Must be today or later.
          example: '2026-07-10'
        endDate:
          type: string
          format: date
          description: End date in YYYY-MM-DD format. Must be today or later and not before startDate.
          example: '2026-07-13'
        defaultCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
    Trip:
      type: object
      required:
        - id
        - name
        - startDate
        - endDate
        - defaultCurrency
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        defaultCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TripDay:
      type: object
      required:
        - date
        - dayOrder
      properties:
        date:
          type: string
          format: date
        dayOrder:
          type: integer
          minimum: 1
    UpdateTripRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: 오사카 4박 5일
        startDate:
          type: string
          format: date
          description: Start date in YYYY-MM-DD format. May be past, current, or future.
          example: '2026-07-10'
        endDate:
          type: string
          format: date
          description: End date in YYYY-MM-DD format. Must not be before the merged startDate.
          example: '2026-07-14'
        defaultCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
    UpdateTripResponse:
      type: object
      required:
        - trip
      properties:
        trip:
          $ref: '#/components/schemas/Trip'
    TripListItem:
      type: object
      required:
        - id
        - name
        - startDate
        - endDate
        - defaultCurrency
        - joinedAt
        - createdAt
        - myRole
        - participantCount
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        defaultCurrency:
          $ref: '#/components/schemas/SupportedCurrency'
        joinedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        myRole:
          $ref: '#/components/schemas/TripParticipantRole'
        participantCount:
          type: integer
          minimum: 1
    ListTripsResponse:
      type: object
      required:
        - trips
      properties:
        trips:
          type: array
          items:
            $ref: '#/components/schemas/TripListItem'
    TripParticipant:
      type: object
      required:
        - id
        - tripId
        - userId
        - role
        - displayName
        - joinedAt
      properties:
        id:
          type: string
        tripId:
          type: string
        userId:
          type: string
        role:
          $ref: '#/components/schemas/TripParticipantRole'
        displayName:
          type: string
        joinedAt:
          type: string
          format: date-time
    CreateTripResponse:
      type: object
      required:
        - trip
        - ownerParticipant
      properties:
        trip:
          $ref: '#/components/schemas/Trip'
        ownerParticipant:
          $ref: '#/components/schemas/TripParticipant'
    TripParticipantSummary:
      type: object
      required:
        - totalCount
        - previewNames
        - overflowCount
      properties:
        totalCount:
          type: integer
          minimum: 0
          example: 4
        previewNames:
          type: array
          maxItems: 3
          items:
            type: string
          example:
            - 민수
            - 지영
            - 현우
        overflowCount:
          type: integer
          minimum: 0
          example: 1
    GetTripDetailResponse:
      type: object
      required:
        - trip
        - participantSummary
        - days
      properties:
        trip:
          $ref: '#/components/schemas/Trip'
        participantSummary:
          $ref: '#/components/schemas/TripParticipantSummary'
        days:
          type: array
          items:
            $ref: '#/components/schemas/TripDay'
    AuthProvider:
      type: string
      enum:
        - apple
        - kakao
    AuthResult:
      type: string
      enum:
        - login_success
        - refresh_success
        - logout_success
        - provider_link_success
    OAuthCredential:
      type: object
      description: Provider credential. Apple uses identityToken/authorizationCode/nonce. Kakao uses accessToken. dev* fields are accepted only when server dev OAuth is enabled.
      additionalProperties: false
      properties:
        identityToken:
          type: string
        authorizationCode:
          type: string
        nonce:
          type: string
        accessToken:
          type: string
        devSubject:
          type: string
        email:
          type: string
          nullable: true
        emailVerified:
          type: boolean
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    DeviceInfo:
      type: object
      additionalProperties: false
      properties:
        deviceName:
          type: string
          nullable: true
        platform:
          type: string
          nullable: true
    OAuthLoginRequest:
      type: object
      required:
        - provider
        - credential
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/AuthProvider'
        credential:
          $ref: '#/components/schemas/OAuthCredential'
        device:
          $ref: '#/components/schemas/DeviceInfo'
    OAuthLinkRequest:
      type: object
      required:
        - provider
        - credential
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/AuthProvider'
        credential:
          $ref: '#/components/schemas/OAuthCredential'
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      additionalProperties: false
      properties:
        refreshToken:
          type: string
    AuthUser:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    AuthTokens:
      type: object
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
    AuthLoginResponse:
      type: object
      required:
        - result
        - user
        - tokens
      properties:
        result:
          type: string
          enum:
            - login_success
        user:
          $ref: '#/components/schemas/AuthUser'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
    AuthRefreshResponse:
      type: object
      required:
        - result
        - tokens
      properties:
        result:
          type: string
          enum:
            - refresh_success
        tokens:
          $ref: '#/components/schemas/AuthTokens'
    AuthLogoutResponse:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - logout_success
    LinkedIdentity:
      type: object
      required:
        - provider
        - emailVerified
      properties:
        provider:
          $ref: '#/components/schemas/AuthProvider'
        email:
          type: string
          nullable: true
        emailVerified:
          type: boolean
    AuthLinkResponse:
      type: object
      required:
        - result
        - linkedIdentity
      properties:
        result:
          type: string
          enum:
            - provider_link_success
        linkedIdentity:
          $ref: '#/components/schemas/LinkedIdentity'
    AuthMeResponse:
      type: object
      required:
        - user
        - linkedProviders
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        linkedProviders:
          type: array
          items:
            $ref: '#/components/schemas/AuthProvider'
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              example: INTERNAL_ERROR
            message:
              type: string
              example: internal server error
            details:
              type: array
              items:
                type: object
                additionalProperties: true
