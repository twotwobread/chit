        address:
          type: string
          minLength: 1
          maxLength: 300
          example: 1 Chome-1-88 Oyodonaka, Kita Ward, Osaka
        placeType:
          $ref: '#/components/schemas/TripPlaceType'
    UpdateScheduleItemResponse:
      type: object
      required:
        - scheduleItem
      properties:
        scheduleItem:
          $ref: '#/components/schemas/ScheduleItem'
    GooglePlaceSearchResult:
      type: object
      required:
        - googlePlaceId
        - displayName
        - formattedAddress
        - primaryType
      properties:
        googlePlaceId:
          type: string
          example: ChIJ...
        displayName:
          type: string
          example: 도톤보리
        formattedAddress:
          type: string
          example: 1 Chome Dotonbori, Chuo Ward, Osaka, Japan
        primaryType:
          type: string
