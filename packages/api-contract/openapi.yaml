      properties:
        googlePlaceId:
          type: string
          minLength: 1
          maxLength: 255
          example: ChIJ...
        duplicateConfirmed:
          type: boolean
          description: Set true only after the user confirms adding the same Google place to the same Day again.
          example: false
    CreateGooglePlaceScheduleItemResponse:
      type: object
      required:
        - day
        - scheduleItem
      properties:
        day:
          $ref: '#/components/schemas/TripDay'
