        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Provider token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidProviderToken:
                  value:
                    error:
                      code: INVALID_PROVIDER_TOKEN
                      message: provider token is invalid
                      details: []
        '409':
          description: Existing verified email requires explicit account linking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountLinkRequired:
                  value:
                    error:
                      code: ACCOUNT_LINK_REQUIRED
                      message: account link required
                      details:
                        - result: link_required_conflict
                          provider: apple
        '500':
          description: Unexpected server error.
