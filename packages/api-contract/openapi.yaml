        address:
          type: string
          minLength: 1
          maxLength: 300
          example: 1 Chome-1-88 Oyodonaka, Kita Ward, Osaka
        placeType:
          $ref: '#/components/schemas/TripPlaceType'
    UpdateDayItineraryItemResponse:
      type: object
      required:
        - item
