services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ium
      POSTGRES_USER: ium
      POSTGRES_PASSWORD: ium
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ium -d ium"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
