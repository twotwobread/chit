name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.5'
          cache-dependency-path: apps/api/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.3'

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.6'

      - name: Terraform fmt
        run: terraform -chdir=infra/terraform/gcp-staging fmt -check

      - name: Terraform init without backend
        run: terraform -chdir=infra/terraform/gcp-staging init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform/gcp-staging validate
